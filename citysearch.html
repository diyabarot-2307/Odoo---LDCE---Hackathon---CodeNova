<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Search</title>
<style>
body{font-family:Arial;background:#f2f6ff;display:flex;justify-content:center;padding-top:50px;margin:0}
.box{background:#fff;width:350px;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
h2{text-align:center}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
ul{list-style:none;padding:0;margin:10px 0 0;max-height:200px;overflow-y:auto}
li{padding:10px;border-radius:6px;cursor:pointer} li:hover{background:#e8f0ff}
</style>
</head>
<body>
<div class="box">
<h2>🔍 Search City</h2>
<input id="search" placeholder="Enter city name..." onkeyup="searchCity()">
<ul id="list"></ul>
</div>

<script>
let cities=["Mumbai","Delhi","Vadodara","Goa","Jaipur","Manali","Udaipur","Kerala","Darjeeling","Leh Ladakh","Rishikesh","Ahmedabad","Pune","Kolkata","Hyderabad"];

function searchCity(){
  let q=search.value.toLowerCase();
  let result=q ? cities.filter(c=>c.toLowerCase().includes(q)) : [];
  list.innerHTML=result.map(c=>`<li onclick="selectCity('${c}')">${c}</li>`).join("");
}
function selectCity(city){
  search.value=city;
  list.innerHTML="";
  alert("You selected: "+city);
}
</script>
</body>
</html>
