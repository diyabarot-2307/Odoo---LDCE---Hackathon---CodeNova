<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobeTrotter - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', Arial, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #f0f2f6 0%, #e8ebf5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Decorative background blobs */
  body::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    opacity: 0.08;
    top: -150px;
    left: -150px;
  }

  body::after {
    content: '';
    position: absolute;
    width: 350px;
    height: 350px;
    background: linear-gradient(135deg, #764ba2, #667eea);
    border-radius: 50%;
    opacity: 0.08;
    bottom: -150px;
    right: -150px;
  }

  .container {
    background: white;
    padding: 45px 40px;
    border-radius: 24px;
    width: 360px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(30,30,60,0.12);
    position: relative;
    z-index: 1;
  }

  /* Custom logo */
  .logo-badge {
    width: 76px;
    height: 76px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px auto;
    box-shadow: 0 10px 25px rgba(102,126,234,0.4);
  }

  .logo-badge {
    font-size: 34px;
  }

  h1 {
    color: #1a1a2e;
    margin-bottom: 6px;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  h1 span {
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    color: #999;
    margin-bottom: 30px;
    font-size: 13px;
    font-weight: 500;
  }

  .field-group {
    text-align: left;
    margin-bottom: 14px;
  }

  .field-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  input {
    width: 100%;
    padding: 13px 15px;
    border: 1.5px solid #ececec;
    border-radius: 12px;
    font-size: 14px;
    background: #fafbfc;
    font-family: inherit;
  }

  input:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.25s;
    letter-spacing: 0.2px;
  }

  button:hover {
    box-shadow: 0 10px 20px rgba(26,26,46,0.3);
    transform: translateY(-2px);
  }

  a {
    color: #667eea;
    font-weight: 700;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .signup-text {
    margin-top: 22px;
    font-size: 13px;
    color: #888;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
    color: #ccc;
    font-size: 11px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #eee;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="logo-badge">🌍</div>

    <h1>Globe<span>Trotter</span></h1>
    <p class="tagline">Plan your trips, your way ✈️</p>

    <form id="loginForm">
      <div class="field-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit">Login →</button>
    </form>

    <p class="signup-text">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      alert('Login clicked with: ' + email);
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
